<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: 'Trebuchet MS', sans-serif; background: #000; }
  canvas { display: block; }
  .label { position: absolute; transform: translate(-50%, 0); background: rgba(255,255,255,.95); padding: 6px 16px;
           border-radius: 18px; font-weight: bold; font-size: 22px; color: #b3121f; box-shadow: 0 3px 8px rgba(0,0,0,.25); }
  .label small { display: block; font-size: 13px; color: #444; font-weight: normal; text-align: center; }
</style>
</head>
<body>
<script type="importmap">{ "imports": {
  "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
} }</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { makePlaidCanvas, makeBoy, lookAt, YUSUF, MUSA } from './characters-preview.js';

const q = new URLSearchParams(location.search);
const shot = q.get('shot') || 'full';

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// sky gradient
{
  const c = document.createElement('canvas'); c.width = 2; c.height = 512;
  const g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 512);
  gr.addColorStop(0, '#5fb0f0'); gr.addColorStop(0.6, '#a9dcff'); gr.addColorStop(1, '#fde7c4');
  g.fillStyle = gr; g.fillRect(0, 0, 2, 512);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  scene.background = t;
}
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;

const camera = new THREE.PerspectiveCamera(shot === 'full' ? 26 : 24, innerWidth / innerHeight, 0.05, 100);

// lights: warm key, cool rim, soft fill
const key = new THREE.DirectionalLight(0xffe7cc, 2.6);
key.position.set(-1.6, 3.2, 3.0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -1.5; key.shadow.camera.right = 1.5; key.shadow.camera.top = 2; key.shadow.camera.bottom = -0.5;
key.shadow.bias = -0.0002; key.shadow.normalBias = 0.002; key.shadow.radius = 3;
scene.add(key);
const rim = new THREE.DirectionalLight(0xbfe0ff, 2.2);
rim.position.set(2.2, 2.4, -2.5);
scene.add(rim);
const rim2 = new THREE.DirectionalLight(0xffd6b0, 1.0);
rim2.position.set(-2.5, 1.5, -2.0);
scene.add(rim2);
scene.add(new THREE.HemisphereLight(0xcfe8ff, 0x6d8a4a, 0.6));

// ground with grass variation
{
  const geo = new THREE.CircleGeometry(14, 128);
  const cols = [];
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i);
    const n = 0.5 + 0.5 * Math.sin(x * 3.1 + Math.sin(y * 2.3)) * Math.cos(y * 2.7);
    const c = new THREE.Color(0x4f9636).lerp(new THREE.Color(0x76b24a), n * 0.6);
    cols.push(c.r, c.g, c.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  const ground = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 }));
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);
  // fence
  const fenceMat = new THREE.MeshStandardMaterial({ color: 0xb08a66, roughness: 0.95 });
  for (let i = -24; i <= 24; i++) {
    const b = new THREE.Mesh(new THREE.BoxGeometry(0.14, 1.5, 0.025), fenceMat);
    b.position.set(i * 0.155, 0.75, -3.2);
    b.receiveShadow = true;
    scene.add(b);
  }
  const rail = new THREE.Mesh(new THREE.BoxGeometry(8, 0.08, 0.04), fenceMat);
  rail.position.set(0, 1.2, -3.17); scene.add(rail);
}

const plaid = makePlaidCanvas(6);
const yusuf = makeBoy(YUSUF, plaid);
yusuf.position.set(-0.3, 0, 0);
yusuf.rotation.y = 0.28;
scene.add(yusuf);
const musa = makeBoy(MUSA, plaid);
musa.position.set(0.32, 0, 0.04);
musa.rotation.y = -0.3;
scene.add(musa);

if (shot === 'full') {
  camera.position.set(0.05, 0.95, 4.1);
  camera.lookAt(0.02, 0.74, 0);
} else {
  camera.position.set(0.02, 1.3, 1.45);
  camera.lookAt(0.02, 1.27, 0);
}
scene.updateMatrixWorld(true);
const eyeTarget = camera.position.clone();
lookAt(yusuf, eyeTarget);
lookAt(musa, eyeTarget);

let composer = null;
if (q.get('ao') === '1') {
  const rt = new THREE.WebGLRenderTarget(innerWidth * devicePixelRatio, innerHeight * devicePixelRatio, { samples: 4, type: THREE.HalfFloatType });
  composer = new EffectComposer(renderer, rt);
  composer.addPass(new RenderPass(scene, camera));
  const ao = new GTAOPass(scene, camera, innerWidth, innerHeight);
  ao.updateGtaoMaterial({ radius: 0.12, distanceExponent: 1, thickness: 1, scale: 1.0, samples: 16 });
  ao.blendIntensity = 0.85;
  composer.addPass(ao);
  composer.addPass(new OutputPass());
  composer.render();
} else {
  renderer.render(scene, camera);
}

function label(obj, text, sub, yTop) {
  const v = new THREE.Vector3(obj.position.x, yTop, obj.position.z).project(camera);
  const el = document.createElement('div');
  el.className = 'label';
  el.innerHTML = `${text}<small>${sub}</small>`;
  el.style.left = ((v.x + 1) / 2 * innerWidth) + 'px';
  el.style.top = ((1 - v.y) / 2 * innerHeight) + 'px';
  document.body.appendChild(el);
}
if (shot === 'full') {
  label(yusuf, 'Yusuf', 'Plano, TX', -0.02);
  label(musa, 'Musa', 'Greensboro, NC', -0.02);
}
window.__ready = true;
</script>
</body>
</html>
