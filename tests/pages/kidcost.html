<!DOCTYPE html><html><body><script type="module">
import * as THREE from 'three';
import { makeBoy, KIDS } from '/src/characters.js';

  parts[key] = parts[key] || [0, 0]; parts[key][0]++; parts[key][1] += t; });
window.__times = { meshes, tris: Math.round(tris), parts: Object.fromEntries(Object.entries(parts).sort((a, b) => b[1][1] - a[1][1]).slice(0, 12)) };

</script></body></html>
